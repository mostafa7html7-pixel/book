<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كتب الفشن</title>
    <link rel="icon" href="https://cdn.iconscout.com/icon/free/png-256/book-236-444346.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        #cart-btn::after {
            /* هذا هو السطر الأهم، يقوم بسحب الرقم من الجافا سكريبت */
            content: var(--cart-count, "0");

            position: absolute;
            top: -5px;
            right: -5px;
            background-color: #ff5e3a;
            /* لون أحمر/برتقالي للتنبيه */
            color: white;
            font-size: 12px;
            font-weight: bold;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid var(--header-bg);
        }

        :root {
            --primary: #ff5e3a;
            --grad: linear-gradient(90deg, #ff4e31, #ff8c31);
            --bg: #0a0a0a;
            
            /* --- متغيرات الألوان --- */
            --text-main: #ffffff;
            --text-sec: #cccccc;
            --header-bg: rgba(10, 10, 10, 0.95);
            --sidebar-bg: #111;
            --border-color: #333;
            --input-bg: #111;
            --card-bg: #1a1a1a;
        }

        body.light-mode {
            --bg: #f4ecd8;
            --text-main: #2c2520;
            --text-sec: #5d534a;
            --header-bg: rgba(244, 236, 216, 0.95);
            --sidebar-bg: #f4ecd8;
            --border-color: #8c7b6c;
            --input-bg: rgba(232, 224, 197, 0.6);
            --card-bg: rgba(255, 253, 240, 0.9);
        }

        /* --- تأثير ملمس الورق في الوضع النهاري --- */
        body.light-mode .bg-grid::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
            opacity: 0.5;
            mix-blend-mode: multiply;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- تأثير Blur للصور عند التحميل --- */
        img[loading="lazy"] {
            filter: blur(10px);
            transition: filter 0.6s ease-in-out;
        }
        img.loaded { filter: blur(0); }

        /* --- نضافة الخلفية --- */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at center, var(--input-bg) 0%, var(--bg) 100%);
            perspective: 1000px;
        }

        .grid-layer {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
            background-image:
                linear-gradient(to right, rgba(128, 128, 128, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(128, 128, 128, 0.1) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(50deg) rotateZ(-5deg);
            mask-image: radial-gradient(circle, black, transparent 85%);
        }

        /* --- الهيدر --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            background: var(--header-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-txt {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary);
        }

        .logo-box {
            background: var(--grad);
            padding: 10px;
            border-radius: 10px;
            color: white;
        }

        .nav-center {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .search {
            position: relative;
            width: 400px;
            max-width: 90%;
        }

        .search input {
            width: 100%;
            padding: 12px 20px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 25px;
            color: var(--text-main);
            text-align: inherit;
            outline: none;
        }

        .search i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-sec);
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        /* --- السلة والعداد --- */
        .cart-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        /* تعديل العداد ليظهر برمجياً */
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        /* Neon Green Accents for Dark Mode */
        body.dark-mode .cart-count {
            background: #39ff14;
            color: black;
        }

        /* --- زر تبديل الثيم --- */
        .theme-toggle {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: 0.3s;
            color: var(--text-sec);
            border: 1px solid var(--border-color);
        }
        .theme-toggle:hover { color: var(--primary); border-color: var(--primary); transform: rotate(15deg); }

        /* --- قائمة الموبايل --- */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
        }

        .hamburger span {
            width: 25px;
            height: 3px;
            background: var(--text-sec);
            margin: 3px 0;
            transition: 0.3s;
        }

        .hamburger.open span:nth-child(1) {
            transform: rotate(-45deg) translate(-5px, 5px);
        }

        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.open span:nth-child(3) {
            transform: rotate(45deg) translate(-5px, -5px);
        }

        /* --- قائمة الموبايل والإعدادات --- */
        .mobile-menu {
            position: fixed; top: 80px; left: 0; width: 100%; height: calc(100vh - 80px);
            background: var(--header-bg); z-index: 99; transform: translateX(-100%);
            transition: 0.3s ease; padding: 20px; display: flex; flex-direction: column; gap: 20px;
            overflow-y: auto; backdrop-filter: blur(10px); border-top: 1px solid var(--border-color);
        }
        .mobile-menu.open { transform: translateX(0); }
        .mobile-menu a { color: var(--text-sec); text-decoration: none; font-weight: 600; font-size: 18px; transition: 0.3s; }
        .mobile-menu a:hover { color: var(--primary); }

        /* إعدادات القائمة */
        .menu-settings { margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border-color); }
        .menu-settings h3 { font-size: 16px; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .setting-item { margin-bottom: 20px; }
        .setting-item label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold; color: var(--text-main); }
        
        .theme-options { display: flex; gap: 10px; }
        .theme-btn { flex: 1; padding: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .theme-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        input[type="range"] { width: 100%; accent-color: var(--primary); }
        select.font-select {
            width: 100%; padding: 8px; border-radius: 8px; background: var(--input-bg);
            border: 1px solid var(--border-color); color: var(--text-main); outline: none;
        }

        .color-options { display: flex; gap: 10px; justify-content: space-between; margin-top: 10px; }
        .color-btn { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid var(--border-color); transition: 0.3s; }
        .color-btn:hover { transform: scale(1.2); border-color: var(--text-main); }

        .pattern-options { display: flex; gap: 5px; margin-top: 10px; }
        .pattern-btn { flex: 1; padding: 8px; font-size: 12px; background: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); cursor: pointer; border-radius: 8px; transition: 0.3s; }
        .pattern-btn:hover { border-color: var(--primary); color: var(--primary); }

        .language-options { display: flex; gap: 10px; margin-top: 10px; }
        .lang-btn { flex: 1; padding: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .lang-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .lang-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* --- تفاعل اللمس (Touch Interaction) --- */
        button:active, a:active, .cart-item:active, .qty-btn:active, .setting-item:active { transform: scale(0.96); }

        /* --- Responsive --- */
        @media (max-width: 768px) {
            .header {
                padding: 10px 20px;
            }

            .logo-txt {
                font-size: 22px;
            }

            .nav-links {
                display: none;
            }

            .nav-links a {
                font-size: 24px;
            }

            .hamburger {
                display: flex;
            }

            .nav-center {
                display: none;
            }

            .nav-right {
                gap: 10px;
            }
        }

        /* --- السلة (Sidebar) --- */
        .cart-sidebar {
            position: fixed; top: 0; right: -400px; width: 380px; height: 100vh;
            background: var(--sidebar-bg); backdrop-filter: blur(15px);
            border-left: 1px solid var(--border-color); z-index: 200;
            transition: 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            overflow-y: auto; padding: 25px;
            box-shadow: -10px 0 40px rgba(0, 0, 0, 0.8);
            display: flex; flex-direction: column;
        }
        .cart-sidebar.open { right: 0; }

        .cart-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 25px; padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }
        .cart-title { font-size: 24px; font-weight: 900; color: var(--text-main); }
        .close-cart {
            width: 32px; height: 32px; background: var(--input-bg);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 14px; color: var(--text-sec); transition: 0.3s;
        }
        .close-cart:hover { background: var(--primary); color: var(--primary); transform: rotate(90deg); }

        .cart-items {
            flex: 1; display: flex; flex-direction: column; gap: 15px;
            margin-bottom: 20px; overflow-y: auto; padding-right: 5px;
        }
        .cart-items::-webkit-scrollbar { width: 4px; }
        .cart-items::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        .cart-item {
            background: var(--input-bg); border: 1px solid var(--border-color);
            border-radius: 16px; padding: 12px; display: flex; align-items: center;
            gap: 15px; transition: 0.3s; position: relative;
        }
        .cart-item:hover { background: var(--border-color); border-color: var(--text-sec); transform: translateX(-3px); }
        .cart-item img { width: 60px; height: 85px; object-fit: cover; border-radius: 10px; }
        .cart-item-details { flex: 1; display: flex; flex-direction: column; gap: 4px; }
        .cart-item-title { font-size: 15px; font-weight: 700; color: var(--text-main); }
        .cart-item-type { color: #888; font-size: 11px; background: var(--border-color); padding: 2px 8px; border-radius: 4px; align-self: flex-start; }
        .cart-item-price { color: var(--primary); font-size: 15px; font-weight: 800; }
        .remove-item {
            width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
            background: rgba(255, 68, 68, 0.1); color: #ff4444; border-radius: 50%;
            cursor: pointer; transition: 0.3s; font-size: 12px; margin-right: 0;
        }
        .remove-item:hover { background: #ff4444; color: white; transform: scale(1.1); }

        .cart-total {
            font-size: 20px; font-weight: 900; margin-bottom: 15px;
            background: var(--input-bg); padding: 15px; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border-color);
        }
        
        /* Quantity Controls */
        .quantity-controls {
            display: flex; align-items: center; gap: 8px; margin-top: 6px;
            background: var(--input-bg); padding: 3px; border-radius: 20px; width: fit-content;
        }
        .qty-btn {
            width: 22px; height: 22px; border-radius: 50%; border: none;
            color: white; font-weight: bold; cursor: pointer; display: flex;
            align-items: center; justify-content: center; font-size: 14px; transition: 0.2s;
        }
        .qty-plus { background-color: #00c851; }
        .qty-plus:hover { background-color: #007e33; }
        .qty-minus { background-color: #ff4444; }
        .qty-minus:hover { background-color: #cc0000; }
        .qty-display { font-size: 13px; font-weight: bold; min-width: 18px; text-align: center; color: var(--text-main); }

        /* --- تحسين السلة للموبايل --- */
        @media (max-width: 768px) {
            .cart-sidebar { width: 85%; right: -85%; border-left: 1px solid var(--border-color); box-shadow: -5px 0 30px rgba(0,0,0,0.8); }
            .cart-sidebar.open { right: 0; }
            .cart-item { padding: 15px; margin-bottom: 10px; }
            .qty-btn { width: 28px; height: 28px; font-size: 16px; }
        }

        /* --- Hero --- */
        .hero {
            height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            margin-top: 80px;
        }

        .btn {
            background: var(--grad);
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            margin: 10px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--text-sec);
            color: var(--text-main);
        }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        .grad-txt {
            background: var(--grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Animations (تأثيرات الحركة) --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { animation: fadeInDown 0.8s ease-out; }
        .hero-inner { animation: fadeInUp 1s ease-out; }
        .hero-inner h1 { animation: fadeInUp 1s ease-out 0.2s both; }
        .hero-inner p { animation: fadeInUp 1s ease-out 0.4s both; }
        .hero-inner .btn { animation: fadeInUp 1s ease-out 0.6s both; }

        /* --- Preloader --- */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 999999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .loader {
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 94, 58, 0.2);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body.loaded #preloader { opacity: 0; visibility: hidden; }

        /* --- Modal Styles --- */
        #checkout-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 9999;
            justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: var(--card-bg); padding: 30px; border-radius: 20px;
            border: 1px solid var(--border-color); width: 90%; max-width: 400px; position: relative;
        }
        .modal-close {
            position: absolute; top: 20px; left: 20px; cursor: pointer;
            color: var(--text-sec); transition: 0.3s;
        }
        .modal-close:hover { color: var(--primary); }
        .modal-input {
            width: 100%; padding: 12px; border-radius: 10px;
            border: 1px solid var(--border-color); background: var(--input-bg);
            color: var(--text-main); outline: none; transition: 0.3s;
        }
        .modal-input:focus { border-color: var(--primary); }
        .modal-body {
            display: flex; flex-direction: column; gap: 15px;
        }
        
        select option {
            background-color: #1a1a1a;
            color: white;
        }
    </style>
</head>

<body>
    <!-- شاشة التحميل -->
    <div id="preloader"><div class="loader"></div></div>

    <div class="bg-grid">
        <div class="grid-layer"></div>
    </div>

    <header class="header">
        <a href="index.html" class="logo">
            <span class="logo-txt">كتب الفشن</span>
            <div class="logo-box"><i class="fas fa-book-open"></i></div>
        </a>

        <div class="nav-center">
            <div class="search">
                <input type="text" placeholder="ابحث عن كتابك...">
                <i class="fas fa-search"></i>
            </div>
        </div>

        <div class="nav-right">
            <nav class="nav-links" id="nav-menu">
                <a href="index.html">الرئيسية</a>
                <a href="index22.html">المتجر</a>
                <a href="contact.html">تواصل معنا</a>
            </nav>

            <div class="theme-toggle" id="theme-toggle"><i class="fas fa-sun"></i></div>
            <div class="cart-btn" id="cart-btn">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-count" id="cart-counter">0</span>
            </div>

            <div class="hamburger" id="hamburger">
                <span></span><span></span><span></span>
            </div>
        </div>
    </header>

    <!-- قائمة الموبايل الجديدة -->
    <div class="mobile-menu" id="mobile-menu">
        <a href="index.html">الرئيسية</a>
        <a href="index22.html">المتجر</a>
        <a href="about.html">من نحن</a>
        <a href="contact.html">تواصل معنا</a>
        
        <div class="menu-settings">
            <button id="settings-toggle" style="width:100%; background:none; border:none; color:var(--primary); font-size:18px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:10px 0; border-bottom: 1px solid var(--border-color);">
                ⚙️ إعدادات العرض <i class="fas fa-chevron-down" style="transition:0.3s"></i>
            </button>
            
            <div id="settings-content" style="display:none; padding-top:15px;">
                <div class="setting-item">
                    <label>الإضاءة</label>
                    <div class="theme-options">
                        <button class="theme-btn" id="btn-light" onclick="setTheme('light')">📜 عتيق</button>
                        <button class="theme-btn active" id="btn-dark" onclick="setTheme('dark')">🌑 ليلي</button>
                    </div>
                </div>

                <div class="setting-item">
                    <label>نوع الخط</label>
                    <select class="font-select" onchange="setFontFamily(this.value)" id="font-family-select">
                        <option value="'Tajawal', sans-serif">تجوال (الافتراضي)</option>
                        <option value="'Amiri', serif">أميري (نسخ)</option>
                        <option value="'Cairo', sans-serif">كايرو (حديث)</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label>تباعد الأسطر</label>
                    <input type="range" min="1.2" max="2.2" step="0.1" value="1.6" id="line-height-slider" oninput="setLineHeight(this.value)">
                </div>

                <div class="setting-item">
                    <label>لون التمييز</label>
                    <div class="color-options">
                        <div class="color-btn" style="background: #ff5e3a;" onclick="setPrimaryColor('#ff5e3a')"></div>
                        <div class="color-btn" style="background: #00c851;" onclick="setPrimaryColor('#00c851')"></div>
                        <div class="color-btn" style="background: #33b5e5;" onclick="setPrimaryColor('#33b5e5')"></div>
                        <div class="color-btn" style="background: #aa66cc;" onclick="setPrimaryColor('#aa66cc')"></div>
                        <div class="color-btn" style="background: #ffbb33;" onclick="setPrimaryColor('#ffbb33')"></div>
                    </div>
                </div>

                <div class="setting-item">
                    <label>نمط الخلفية</label>
                    <div class="pattern-options">
                        <button class="pattern-btn" onclick="setPattern('grid')">شبكة</button>
                        <button class="pattern-btn" onclick="setPattern('dots')">نقط</button>
                        <button class="pattern-btn" onclick="setPattern('lines')">خطوط</button>
                        <button class="pattern-btn" onclick="setPattern('none')">بدون</button>
                    </div>
                </div>

                <button class="btn" onclick="resetSettings()" style="width:100%; margin-top:10px; background:var(--card-bg); border:1px solid var(--border-color);">
                    إعادة ضبط الإعدادات ↺
                </button>
            </div>
        </div>
    </div>

    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2 class="cart-title">السلة</h2>
            <i class="fas fa-times close-cart" id="close-cart"></i>
        </div>
        <div class="cart-items" id="cart-items">
            <p class="empty-cart">السلة فارغة</p>
        </div>
        <div class="cart-total" id="cart-total">المجموع: 0$</div>
        <button class="btn" style="width: 100%; margin: 0;">إتمام الدفع</button>
    </div>

    <main class="hero">
        <div class="hero-inner">
            <div
                style="background: rgba(255,87,34,0.1); color: #ff8c31; padding: 5px 15px; border-radius: 20px; display: inline-block; margin-bottom: 20px;">
                🔥 عروض حصرية: أي كتاب PDF بـ 0$ فقط!
            </div>
            <h1 style="font-size: 3rem; margin-bottom: 20px;">أشعل شغفك <span class="grad-txt">بالقراءة</span></h1>
            <p style="color: var(--text-sec); margin-bottom: 30px;">اكتشف عالم الكتب الرقمية بأسعار مذهلة.</p>
            <button class="btn" onclick="window.location.href='index22.html'">استعرض المتجر</button>
            <button class="btn btn-outline" onclick="window.location.href='contact.html'">تواصل معنا</button>
        </div>
    </main>
    <script>
        // 1. تعريف العناصر
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobile-menu');
        const cartBtn = document.getElementById('cart-btn');
        const cartSidebar = document.getElementById('cart-sidebar');
        const closeCart = document.getElementById('close-cart');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartTotalDisplay = document.getElementById('cart-total');

        // 2. جلب البيانات من الذاكرة المحلية
        let cart = JSON.parse(localStorage.getItem('fashon_cart')) || [];

        // 3. دالة تحديث واجهة السلة (تم تعديل استدعاء الحذف هنا)
        function updateCartUI() {
            // نحدث المصفوفة من الذاكرة لضمان المزامنة
            cart = JSON.parse(localStorage.getItem('fashon_cart')) || [];
            cartItemsContainer.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = '<p class="empty-cart"> (❁´◡`❁) السلة فارغة </p>';
            } else {
                cart.forEach((item, index) => {
                    const q = item.quantity || 1;
                    total += item.price * q;
                    cartItemsContainer.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.title}" loading="lazy">
                        <div class="cart-item-details">
                            <div class="cart-item-title">${item.title}</div>
                            <div class="cart-item-type">${item.type === 'paper' ? 'ورقي' : 'PDF'}</div>
                            <div class="cart-item-price">${item.price}$</div>
                            <div class="quantity-controls">
                                <button class="qty-btn qty-minus" onclick="updateItemQuantity(event, ${index}, -1)">-</button>
                                <span class="qty-display">${q}</span>
                                <button class="qty-btn qty-plus" onclick="updateItemQuantity(event, ${index}, 1)">+</button>
                            </div>
                        </div>
                        <i class="fas fa-trash remove-item" onclick="handleRemove(event, ${index})"></i>
                    </div>
                `;
                });
            }

            cartTotalDisplay.innerHTML = `<span>المجموع</span> <span style="color:var(--primary)">${total}$</span>`;
            const count = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
            document.documentElement.style.setProperty('--cart-count', `"${count}"`);
            localStorage.setItem('fashon_cart', JSON.stringify(cart));
            applyBlurEffectToImages(); // تطبيق التأثير على الصور الجديدة في السلة
        }

        // 4. دالة الحذف الذكية (تمنع إغلاق السلة نهائياً)
        window.handleRemove = function (event, index) {
            if (event) {
                event.preventDefault();
                event.stopPropagation(); // هذا السطر يمنع إغلاق السلة عند الحذف
            }

            cart.splice(index, 1);
            localStorage.setItem('fashon_cart', JSON.stringify(cart));

            // تحديث الواجهة فوراً
            updateCartUI();
        };

        // دالة تحديث الكمية
        window.updateItemQuantity = function(event, index, change) {
            event.stopPropagation();
            if (cart[index]) {
                cart[index].quantity = (cart[index].quantity || 1) + change;
                if (cart[index].quantity <= 0) cart.splice(index, 1);
                localStorage.setItem('fashon_cart', JSON.stringify(cart));
                updateCartUI();
            }
        };

        // 5. التحكم في القوائم (محدث ليعمل الموبايل والحذف)
        hamburger.onclick = (e) => {
            e.stopPropagation();
            hamburger.classList.toggle('open');
            mobileMenu.classList.toggle('open');
        };

        cartBtn.onclick = () => cartSidebar.classList.add('open');
        closeCart.onclick = () => cartSidebar.classList.remove('open');

        // إغلاق عند النقر في الخارج مع استثناء عناصر السلة والقائمة
        document.onclick = (e) => {
            if (!cartSidebar.contains(e.target) && !cartBtn.contains(e.target) && !hamburger.contains(e.target) && !mobileMenu.contains(e.target)) {
                cartSidebar.classList.remove('open');
                mobileMenu.classList.remove('open');
                hamburger.classList.remove('open');
            }
        };

        updateCartUI();

        // 7. مزامنة التبويبات (المتجر مع الرئيسية)
        window.addEventListener('storage', (e) => {
            if (e.key === 'fashon_cart') {
                updateCartUI();
            }
        });

        // --- إعدادات العرض (Settings Logic) ---
        const themeToggle = document.getElementById('theme-toggle');
        const body = document.body;
        const icon = themeToggle.querySelector('i');

        function setTheme(mode) {
            if (mode === 'light') {
                body.classList.add('light-mode');
                icon.classList.replace('fa-sun', 'fa-moon');
                document.getElementById('btn-light').classList.add('active');
                document.getElementById('btn-dark').classList.remove('active');
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.remove('light-mode');
                icon.classList.replace('fa-moon', 'fa-sun');
                document.getElementById('btn-dark').classList.add('active');
                document.getElementById('btn-light').classList.remove('active');
                localStorage.setItem('theme', 'dark');
            }
        }

        function setFontFamily(font) { document.body.style.fontFamily = font; localStorage.setItem('fontFamily', font); }
        function setLineHeight(height) { document.body.style.lineHeight = height; localStorage.setItem('lineHeight', height); }
        
        function setPrimaryColor(color) {
            document.documentElement.style.setProperty('--primary', color);
            localStorage.setItem('primaryColor', color);
            
            const gradients = {
                '#ff5e3a': 'linear-gradient(90deg, #ff4e31, #ff8c31)',
                '#00c851': 'linear-gradient(90deg, #007e33, #00c851)',
                '#33b5e5': 'linear-gradient(90deg, #0099cc, #33b5e5)',
                '#aa66cc': 'linear-gradient(90deg, #9933cc, #aa66cc)',
                '#ffbb33': 'linear-gradient(90deg, #ff8800, #ffbb33)'
            };
            if(gradients[color]) {
                document.documentElement.style.setProperty('--grad', gradients[color]);
                localStorage.setItem('primaryGrad', gradients[color]);
            }
        }
        
        function setPattern(pattern) {
            const gridLayer = document.querySelector('.grid-layer');
            if(!gridLayer) return;
            localStorage.setItem('bgPattern', pattern);
            gridLayer.style.backgroundImage = ''; gridLayer.style.backgroundSize = '';
            const color = 'var(--border-color)'; 
            if(pattern === 'grid') {
                gridLayer.style.backgroundImage = `linear-gradient(to right, ${color} 1px, transparent 1px), linear-gradient(to bottom, ${color} 1px, transparent 1px)`;
                gridLayer.style.backgroundSize = '60px 60px';
            } else if(pattern === 'dots') {
                gridLayer.style.backgroundImage = `radial-gradient(${color} 1px, transparent 1px)`;
                gridLayer.style.backgroundSize = '20px 20px';
            } else if(pattern === 'lines') {
                gridLayer.style.backgroundImage = `repeating-linear-gradient(45deg, ${color} 0, ${color} 1px, transparent 0, transparent 50%)`;
                gridLayer.style.backgroundSize = '30px 30px';
            } else if(pattern === 'none') {
                gridLayer.style.backgroundImage = 'none';
            }
        }
        
        // --- إعدادات القائمة (Toggle) ---
        const settingsToggle = document.getElementById('settings-toggle');
        if(settingsToggle){
            settingsToggle.onclick = function() {
                const content = document.getElementById('settings-content');
                const icon = this.querySelector('i');
                if (content.style.display === 'none') {
                    content.style.display = 'block';
                    icon.style.transform = 'rotate(180deg)';
                } else {
                    content.style.display = 'none';
                    icon.style.transform = 'rotate(0deg)';
                }
            };
        }

        function resetSettings() {
            localStorage.removeItem('theme');
            localStorage.removeItem('fontFamily');
            localStorage.removeItem('lineHeight');
            localStorage.removeItem('primaryColor');
            localStorage.removeItem('primaryGrad');
            localStorage.removeItem('bgPattern');
            location.reload();
        }

        // تحميل الإعدادات عند البدء
        const savedTheme = localStorage.getItem('theme') || 'dark'; setTheme(savedTheme);
        const savedFont = localStorage.getItem('fontFamily'); if(savedFont) { document.body.style.fontFamily = savedFont; document.getElementById('font-family-select').value = savedFont; }
        const savedLineHeight = localStorage.getItem('lineHeight'); if(savedLineHeight) { document.body.style.lineHeight = savedLineHeight; document.getElementById('line-height-slider').value = savedLineHeight; }
        const savedColor = localStorage.getItem('primaryColor'); if(savedColor) document.documentElement.style.setProperty('--primary', savedColor);
        const savedGrad = localStorage.getItem('primaryGrad'); if(savedGrad) document.documentElement.style.setProperty('--grad', savedGrad);
        const savedPattern = localStorage.getItem('bgPattern') || 'grid'; setPattern(savedPattern);

        themeToggle.onclick = () => setTheme(body.classList.contains('light-mode') ? 'dark' : 'light');

        // --- إخفاء شاشة التحميل ---
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });

        // --- تفعيل تأثير Blur للصور ---
        function applyBlurEffectToImages() {
            document.querySelectorAll('img[loading="lazy"]:not(.blur-handler)').forEach(img => {
                img.classList.add('blur-handler'); // لمنع إضافة المستمع أكثر من مرة
                if (img.complete) {
                    img.classList.add('loaded');
                } else {
                    img.addEventListener('load', () => {
                        img.classList.add('loaded');
                    }, { once: true });
                }
            });
        }
        applyBlurEffectToImages(); // التشغيل الأولي

// فتح نافذة البيانات عند الضغط على إتمام الدفع في السلة
const checkoutBtn = document.querySelector('.cart-sidebar .btn');
if(checkoutBtn) {
    checkoutBtn.onclick = () => {
        if (cart.length === 0) return alert("السلة فارغة!");
        document.getElementById('checkout-modal').style.display = 'flex';
    }
}

function closeCheckout() {
    document.getElementById('checkout-modal').style.display = 'none';
}

function confirmOrder() {
    const name = document.getElementById('cust-name').value.trim();
    const age = document.getElementById('cust-age').value.trim();
    const address = document.getElementById('cust-address').value.trim();
    const phoneInput = document.getElementById('cust-phone').value.trim();
    const notes = document.getElementById('cust-notes').value.trim();
    const paymentMethod = document.getElementById('payment-method').value;

    // 1. التحقق من البيانات
    if (name.split(' ').length < 3) return alert("يرجى كتابة الاسم ثلاثياً");
    if (!age || age < 5 || age > 90) return alert("يرجى إدخال عمر صحيح");
    if (address.length < 10) return alert("يرجى كتابة العنوان بالتفصيل");
    
    // التحقق من رقم الهاتف المصري (يبدأ بـ 01 ومكون من 11 رقم)
    const phoneRegex = /^01[0125][0-9]{8}$/;
    if (!phoneRegex.test(phoneInput)) return alert("يرجى إدخال رقم هاتف مصري صحيح (11 رقم)");
    if (!paymentMethod) return alert("يرجى اختيار طريقة الدفع");

    // 2. التفاعل المفرح
    confetti({
        particleCount: 200,
        spread: 100,
        origin: { y: 0.6 }
    });

    // 3. تجهيز الرسالة لواتساب الخاص بك
    const myNumber = "201158606601"; 
    let message = `🚀 *طلب جديد من متجر الفشن*\n\n`;
    message += `👤 *الاسم:* ${name}\n`;
    message += `🎂 *العمر:* ${age} سنة\n`;
    message += `📍 *العنوان:* ${address}\n`;
    message += `📞 *هاتف العميل:* ${phoneInput}\n\n`;
    if(notes) message += `📝 *ملاحظات:* ${notes}\n`;
    message += `💳 *طريقة الدفع:* ${paymentMethod}\n\n`;
    message += `� *الكتب المطلوبة:*\n`;

    let total = 0;
    cart.forEach((item, index) => {
        const q = item.quantity || 1;
        message += `${index + 1}. ${item.title} (${item.type === 'paper' ? 'ورقي' : 'PDF'}) - ${item.price}$ x ${q}\n`;
        total += item.price * q;
    });

    message += `\n💰 *الإجمالي النهائي: ${total}$*`;

    // 4. الإرسال
    setTimeout(() => {
        window.open(`https://wa.me/${myNumber}?text=${encodeURIComponent(message)}`, '_blank');
        closeCheckout();
    }, 1000);
}
    </script>
    <div id="checkout-modal">
    <div class="modal-content">
        <i class="fas fa-times modal-close" onclick="closeCheckout()"></i>
        <h2 style="color:var(--primary); text-align:center; margin-bottom:20px;">بيانات الاستلام 🚚</h2>
        
        <div class="modal-body">
            <input type="text" id="cust-name" placeholder="الاسم الثلاثي" class="modal-input">
            <input type="number" id="cust-age" placeholder="العمر" class="modal-input">
            <input type="text" id="cust-address" placeholder="العنوان بالتفصيل" class="modal-input">
            <input type="tel" id="cust-phone" placeholder="رقم الواتساب (11 رقم)" class="modal-input">
            <textarea id="cust-notes" placeholder="ملاحظات إضافية (اختياري)" rows="3" class="modal-input" style="resize: none;"></textarea>
            <select id="payment-method" class="modal-input" style="cursor:pointer;">
                <option value="" disabled selected>اختر طريقة الدفع</option>
                <option value="كاش عند الاستلام">💵 كاش عند الاستلام</option>
                <option value="فودافون كاش">📱 فودافون كاش</option>
            </select>
            
            <button onclick="confirmOrder()" class="btn" style="width:100%; margin:0; padding:15px;">تأكيد وطلب عبر واتساب</button>
        </div>
    </div>
</div>
</body>

</html>
