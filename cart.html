<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السلة - كتب الفشن</title>
    <link rel="icon" href="https://cdn.iconscout.com/icon/free/png-256/book-236-444346.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        :root {
            --primary: #c5a059;
            --grad: linear-gradient(90deg, #c5a059, #e6c288);
            --bg: #0a0a0a;
            
            /* --- متغيرات الألوان --- */
            --text-main: #ffffff;
            --text-sec: #cccccc;
            --header-bg: rgba(10, 10, 10, 0.95);
            --card-bg: #111;
            --border-color: #333;
            --input-bg: #111;
            --item-bg: #222;
        }
        
        body.dark-mode {
            --primary: #ff0000;
            --grad: linear-gradient(90deg, #ff0000, #ff8c00);
            --bg: #000000;
            --text-main: #ffffff;
            --text-sec: #ffd700;
            --header-bg: rgba(0, 0, 0, 0.95);
            --card-bg: rgba(10, 10, 10, 0.9);
            --border-color: #ff0000;
            --input-bg: #111;
            --item-bg: #1a1a1a;
        }

        body.light-mode {
            --bg: #f4ecd8;
            --text-main: #2c2520;
            --text-sec: #5d534a;
            --header-bg: rgba(244, 236, 216, 0.95);
            --card-bg: rgba(255, 253, 240, 0.9);
            --border-color: #8c7b6c;
            --input-bg: rgba(232, 224, 197, 0.6);
            --item-bg: #fffdf0;
        }

        /* --- تأثير ملمس الورق في الوضع النهاري --- */
        body.light-mode .bg-grid::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://www.transparenttextures.com/patterns/natural-paper.png");
            opacity: 0.5;
            mix-blend-mode: multiply;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* --- نضافة الخلفية (الشبكة المائلة) --- */
        .bg-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at center, var(--card-bg) 0%, var(--bg) 100%);
            perspective: 1000px;
        }
        .grid-layer {
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%;
            background-image: 
                linear-gradient(to right, rgba(128,128,128,0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(128,128,128,0.1) 1px, transparent 1px);
            background-size: 60px 60px;
            transform: rotateX(50deg) rotateZ(-5deg);
            mask-image: radial-gradient(circle, black, transparent 85%);
        }

        /* --- الهيدر (Responsive Navbar) --- */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 5%; position: fixed; top: 0; left: 0; width: 100%; z-index: 100;
            background: var(--header-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); transition: all 0.3s ease;
        }
        .logo { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .logo-txt { font-size: 28px; font-weight: 900; color: var(--primary); transition: 0.3s; }
        .logo:hover .logo-txt { color: #ff8c31; }
        .logo-box { background: var(--grad); padding: 10px; border-radius: 10px; transition: 0.3s; }
        .logo:hover .logo-box { transform: scale(1.1); }

        .nav-center { flex: 1; display: flex; justify-content: center; }
        .search { position: relative; width: 400px; max-width: 100%; }
        .search input {
            width: 100%; padding: 12px 20px; background: #111; border: 1px solid #333;
            border-radius: 25px; color: white; text-align: right; outline: none; transition: 0.3s;
        }
        .search input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255, 94, 58, 0.5); text-align: inherit; }
        .search i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #666; }

        .nav-right { display: flex; align-items: center; gap: 20px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-links a { color: #ccc; text-decoration: none; font-weight: 600; font-size: 16px; transition: 0.3s; position: relative; }
        .nav-links a:hover { color: var(--primary); }
        .nav-links a::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--grad); transition: 0.3s; }
        .nav-links a:hover::after { width: 100%; }

        .cart-btn {
            width: 45px; height: 45px; border-radius: 50%; border: 1px solid #333; background: #111;
            display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.3s;
            position: relative;
        }
        .cart-btn:hover { border-color: var(--primary); transform: scale(1.1); }
        .cart-btn::before { content: var(--cart-count, '0'); position: absolute; top: -5px; right: -5px; background: var(--primary); color: white; border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; font-size: 12px; }

        .hamburger { display: none; flex-direction: column; cursor: pointer; }
        .hamburger span { width: 25px; height: 3px; background: #ccc; margin: 3px 0; transition: 0.3s; }
        .hamburger.open span:nth-child(1) { transform: rotate(-45deg) translate(-5px, 5px); }
        .hamburger.open span:nth-child(2) { opacity: 0; }
        .hamburger.open span:nth-child(3) { transform: rotate(45deg) translate(-5px, -5px); }

        /* --- قائمة الموبايل (Mobile Menu) --- */
        .mobile-menu {
            position: fixed; top: 80px; left: 0; width: 100%; height: calc(100vh - 80px); background: #111;
            z-index: 99; transform: translateX(-100%); transition: 0.3s ease; padding: 20px;
            display: flex; flex-direction: column; gap: 20px;
        }
        .mobile-menu.open { transform: translateX(0); }
        .mobile-menu a { color: #ccc; text-decoration: none; font-weight: 600; font-size: 18px; transition: 0.3s; }
        .mobile-menu a:hover { color: var(--primary); }

        /* --- إعدادات القائمة --- */
        .menu-settings {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        .menu-settings h3 { font-size: 16px; margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 8px; }
        .setting-item { margin-bottom: 20px; }
        .setting-item label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: bold; color: var(--text-main); }
        
        .theme-options { display: flex; gap: 10px; }
        .theme-btn { flex: 1; padding: 8px; border: 1px solid var(--border-color); background: var(--input-bg); color: var(--text-main); border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .theme-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        input[type="range"] { width: 100%; accent-color: var(--primary); }
        
        select.font-select {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            outline: none;
        }

        /* --- محتوى السلة --- */
        .cart-page {
            padding: 120px 5% 50px; max-width: 1200px; margin: 0 auto; text-align: center;
        }
        .cart-page h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; margin-bottom: 20px; }
        .grad-txt { background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .cart-container {
            display: grid; grid-template-columns: 1fr; gap: 30px; margin-top: 40px;
        }
        .cart-items {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .cart-item {
            display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border-color);
            transition: 0.3s;
        }
        .cart-item:hover { background: rgba(255, 94, 58, 0.05); border-radius: 10px; padding: 10px; }
        .cart-item img { width: 80px; height: 120px; object-fit: cover; border-radius: 10px; }
        .cart-item-details { flex: 1; text-align: right; }
        .cart-item-title { font-size: 18px; font-weight: 700; margin-bottom: 5px; }
        .cart-item-type { color: var(--text-sec); font-size: 14px; margin-bottom: 5px; }
        .cart-item-price { color: var(--primary); font-size: 16px; font-weight: 700; }
        .quantity-controls { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .quantity-btn {
            width: 30px; height: 30px; border: 1px solid var(--border-color); background: var(--item-bg); color: var(--text-main); border-radius: 50%;
            cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: center;
        }
        .quantity-btn:hover { background: var(--primary); }
        .quantity { font-size: 16px; font-weight: 700; min-width: 30px; text-align: center; }
        .remove-item { cursor: pointer; color: #ff4e31; font-size: 20px; transition: 0.3s; }
        .remove-item:hover { color: #ff1a1a; transform: scale(1.1); }

        .cart-summary {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 15px; padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center;
        }
        .cart-total { font-size: 24px; font-weight: 900; margin-bottom: 20px; }
        .checkout-btn {
            background: var(--grad); border: none; padding: 15px 40px; border-radius: 12px;
            color: white; font-weight: 700; cursor: pointer; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(255, 78, 49, 0.3);
        }
        .checkout-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(255, 78, 49, 0.5); }
        .back-to-store { margin-top: 20px; }
        .back-to-store a {
            color: var(--primary); text-decoration: none; font-weight: 600; transition: 0.3s;
        }
        .back-to-store a:hover { text-decoration: underline; }

        .empty-cart { text-align: center; color: var(--text-sec); font-size: 18px; margin-top: 50px; }

        /* --- ضبط الموبايل --- */
        @media (max-width: 768px) {
            .nav-links { display: none; }
            .hamburger { display: flex; }
            .nav-center { display: none; }
            .header { padding: 10px 15px; }
            .logo-txt { font-size: 20px; }
            .nav-right { gap: 8px; }
            .theme-toggle, .cart-btn { width: 38px; height: 38px; }
            .cart-page { padding: 100px 20px 50px; }
            .cart-item { flex-direction: column; text-align: center; }
            .cart-item-details { text-align: center; }
            .cart-container { grid-template-columns: 1fr; }
        }

        /* --- Animations (تأثيرات الحركة) --- */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { animation: fadeInDown 0.8s ease-out; }
        .cart-page h1, .cart-page p { animation: fadeInUp 0.8s ease-out; }
        .cart-container { animation: fadeInUp 1s ease-out 0.3s both; }

        /* --- Preloader --- */
        #preloader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 999999;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .loader {
            width: 50px; height: 50px;
            border: 4px solid rgba(255, 94, 58, 0.2);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        body.loaded #preloader { opacity: 0; visibility: hidden; }
    </style>
</head>
<body>
    <!-- شاشة التحميل -->
    <div id="preloader"><div class="loader"></div></div>

    <div class="bg-grid"><div class="grid-layer"></div></div>

    <header class="header">
        <div class="logo">
            <span class="logo-txt">كتب الفشن</span>
            <div class="logo-box"><i class="fas fa-book-open"></i></div>
        </div>
        <div class="nav-center">
            <div class="search">
                <input type="text" id="search-input" placeholder="ابحث عن كتابك...">
                <i class="fas fa-search"></i>
            </div>
        </div>
        <div class="nav-right">
            <nav class="nav-links">
                <a href="index.html">الرئيسية</a>
                <a href="index.html#store">المتجر</a>
                <a href="contact.html">تواصل معنا</a>
            </nav>
            <div class="theme-toggle" id="theme-toggle"><i class="fas fa-sun"></i></div>
            <div class="cart-btn" id="cart-btn"><i class="fas fa-shopping-cart"></i></div>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </header>

    <!-- قائمة الموبايل -->
    <div class="mobile-menu" id="mobile-menu">
        <a href="index.html">الرئيسية</a>
        <a href="index.html#store">المتجر</a>
        <a href="about.html">من نحن</a>
        <a href="contact.html">تواصل معنا</a>
        
        <div class="menu-settings">
            <button id="settings-toggle" style="width:100%; background:none; border:none; color:var(--primary); font-size:18px; font-weight:bold; display:flex; justify-content:space-between; align-items:center; cursor:pointer; padding:10px 0; border-bottom: 1px solid var(--border-color);">
                ⚙️ إعدادات العرض <i class="fas fa-chevron-down" style="transition:0.3s"></i>
            </button>
            
            <div class="setting-item">
                <label data-i18n="theme">الإضاءة</label>
                <div class="theme-options">
                    <button class="theme-btn active" id="btn-old" onclick="setTheme('old')" data-i18n="theme_vintage">📜 عتيق</button>
                    <button class="theme-btn" id="btn-dark" onclick="setTheme('dark')" data-i18n="theme_dark">🌑 ليلي</button>
                </div>
            </div>

            <div class="setting-item">
                <label data-i18n="font_type">نوع الخط</label>
                <select class="font-select" onchange="setFontFamily(this.value)" id="font-family-select">
                    <option value="'Tajawal', sans-serif" data-i18n="font_tajawal">تجوال (الافتراضي)</option>
                    <option value="'Amiri', serif" data-i18n="font_amiri">أميري (نسخ)</option>
                    <option value="'Cairo', sans-serif" data-i18n="font_cairo">كايرو (حديث)</option>
                </select>
            </div>

            <div class="setting-item">
                <label data-i18n="bg_pattern">نمط الخلفية</label>
                <div class="pattern-options">
                    <button class="pattern-btn" onclick="setPattern('grid')" data-i18n="pattern_grid">شبكة</button>
                    <button class="pattern-btn" onclick="setPattern('dots')" data-i18n="pattern_dots">نقط</button>
                    <button class="pattern-btn" onclick="setPattern('lines')" data-i18n="pattern_lines">خطوط</button>
                    <button class="pattern-btn" onclick="setPattern('none')" data-i18n="pattern_none">بدون</button>
                </div>
            </div>

            <div class="setting-item">
                <label data-i18n="language">اللغة (Language)</label>
                <div class="language-options">
                    <button class="lang-btn active" id="btn-ar" onclick="setLanguage('ar')" data-i18n="lang_ar">العربية</button>
                    <button class="lang-btn" id="btn-en" onclick="setLanguage('en')" data-i18n="lang_en">English</button>
                </div>
            </div>
        </div>
    </div>

    <main class="cart-page">
        <h1><span data-i18n="cart_page_title_1">السلة</span> <span class="grad-txt" data-i18n="cart_page_title_2">المشتريات</span></h1>
        <p data-i18n="cart_page_desc">مراجعة مشترياتك قبل الدفع.</p>

        <div class="cart-container">
            <div class="cart-items" id="cart-items">
                <p class="empty-cart" data-i18n="cart_empty">السلة فارغة</p>
            </div>
            <div class="cart-summary">
                <div class="cart-total" id="cart-total"><span data-i18n="total">المجموع</span>: 0$</div>
                <button class="checkout-btn" id="checkout-btn" data-i18n="checkout_now">الدفع الآن</button>
                <div class="back-to-store">
                    <a href="index22.html" data-i18n="back_to_store">العودة إلى المتجر</a>
                </div>
            </div>
        </div>
    </main>

    <script>
        // JavaScript لإدارة القائمة المحمولة والسلة
        const hamburger = document.getElementById('hamburger');
        const mobileMenu = document.getElementById('mobile-menu');
        const cartBtn = document.getElementById('cart-btn');
        const cartItems = document.getElementById('cart-items');
        const cartTotal = document.getElementById('cart-total');
        const checkoutBtn = document.getElementById('checkout-btn');

        let cart = JSON.parse(localStorage.getItem('fashon_cart')) || []; // تحميل السلة من localStorage

        // فتح/إغلاق القائمة المحمولة
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('open');
            mobileMenu.classList.toggle('open');
        });

        // توجيه إلى صفحة السلة
        cartBtn.addEventListener('click', () => {
            window.location.href = 'cart.html';
        });

        // دالة لتحديث الكمية
        function updateQuantity(index, change) {
            cart[index].quantity += change;
            if (cart[index].quantity <= 0) {
                removeFromCart(index);
                return;
            }
            saveCart();
            updateCartDisplay();
        }

        // دالة لحذف عنصر من السلة
        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            updateCartDisplay();
        }

        // حفظ السلة في localStorage
        function saveCart() {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        // تحديث عرض السلة
        function updateCartDisplay() {
            cartItems.innerHTML = '';
            let total = 0;
            if (cart.length === 0) {
                cartItems.innerHTML = `<p class="empty-cart" data-i18n="cart_empty">${translations[localStorage.getItem('language') || 'ar'].cart_empty}</p>`;
            } else {
                cart.forEach((item, index) => {
                    const itemTotal = item.price * item.quantity;
                    total += itemTotal;
                    cartItems.innerHTML += `
                        <div class="cart-item">
                            <img src="${item.image}" alt="${item.title}">
                            <div class="cart-item-details">
                                <div class="cart-item-title">${item.title}</div>
                                <div class="cart-item-type">${item.type === 'paper' ? 'ورقي' : 'PDF'}</div>
                                <div class="cart-item-price">${item.price}$ للوحدة</div>
                                <div class="quantity-controls">
                                    <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">-</button>
                                    <span class="quantity">${item.quantity}</span>
                                    <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                                </div>
                            </div>
                            <i class="fas fa-trash remove-item" onclick="removeFromCart(${index})"></i>
                        </div>
                    `;
                });
            }
            cartTotal.innerHTML = `<span data-i18n="total">${translations[localStorage.getItem('language') || 'ar'].total}</span>: ${total}$`;
            document.documentElement.style.setProperty('--cart-count', cart.reduce((sum, item) => sum + item.quantity, 0));
        }

        // زر الدفع
        checkoutBtn.addEventListener('click', () => {
            if (cart.length === 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'السلة فارغة!',
                    text: 'أضف بعض الكتب أولاً.',
                    confirmButtonText: 'حسنًا'
                });
                return;
            }
            // عرض نموذج جمع البيانات
            document.getElementById('checkout-modal').style.display = 'flex';
        });

        // دالة إغلاق النموذج
        function closeCheckout() {
            document.getElementById('checkout-modal').style.display = 'none';
        }

        // دالة تأكيد الطلب النهائية
        function confirmFinalOrder() {
            const name = document.getElementById('cust-name').value.trim();
            const age = document.getElementById('cust-age').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();

            // التحقق من البيانات باستخدام SweetAlert2
            if (name.split(' ').length < 3) {
                return Swal.fire({ icon: 'warning', title: 'الاسم ناقص', text: 'يرجى كتابة الاسم ثلاثياً.' });
            }
            if (!age || age < 5 || age > 90) {
                return Swal.fire({ icon: 'warning', title: 'العمر!', text: 'يرجى إدخال عمر صحيح.' });
            }
            if (address.length < 10) {
                return Swal.fire({ icon: 'warning', title: 'العنوان ناقص', text: 'يرجى كتابة العنوان بالتفصيل.' });
            }
            if (!/^01[0125][0-9]{8}$/.test(phone)) {
                return Swal.fire({ icon: 'warning', title: 'رقم الهاتف', text: 'يرجى إدخال رقم هاتف مصري صحيح.' });
            }

            // رسالة النجاح والتوجه للواتساب
            Swal.fire({
                title: 'جاري توجيهك للواتساب...',
                text: 'سيتم فتح المحادثة الآن لإتمام طلبك ✨',
                icon: 'success',
                showConfirmButton: false,
                timer: 2000,
                willClose: () => {
                    // تأثير القصاصات الملونة
                    confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });

                    // بناء رسالة الواتساب
                    let msg = `🚀 *طلب جديد من متجر كتب الفشن*\n\n`;
                    msg += `👤 *الاسم:* ${name}\n`;
                    msg += `🎂 *العمر:* ${age} سنة\n`;
                    msg += `📍 *العنوان:* ${address}\n`;
                    msg += `📞 *الهاتف:* ${phone}\n\n`;
                    msg += `📦 *الكتب المطلوبة:*\n`;

                    let total = 0;
                    cart.forEach((item, i) => {
                        msg += `${i + 1}. ${item.title} (${item.type === 'paper' ? 'ورقي' : 'PDF'}) - ${item.price}$\n`;
                        total += item.price;
                    });

                    msg += `\n💰 *الإجمالي النهائي: ${total}$*`;

                    // فتح الرابط
                    window.open(`https://wa.me/201158606601?text=${encodeURIComponent(msg)}`, '_blank');

                    // تفريغ السلة وإغلاق النافذة
                    cart = [];
                    saveCart();
                    updateCartDisplay();
                    closeCheckout();
                }
            });
        }

        // تحميل السلة عند تحميل الصفحة
        updateCartDisplay();

        function updateTranslations() {
            const lang = localStorage.getItem('language') || 'ar';
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang][key]) el.innerText = translations[lang][key];
            });
            document.querySelectorAll('[data-i18n-ph]').forEach(el => {
                const key = el.getAttribute('data-i18n-ph');
                if (translations[lang][key]) el.placeholder = translations[lang][key];
            });
        }

        // --- إدارة الإعدادات (الثيم والخطوط) ---
        function setTheme(mode) {
            if (mode === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('btn-dark').classList.add('active');
                document.getElementById('btn-old').classList.remove('active');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('btn-old').classList.add('active');
                document.getElementById('btn-dark').classList.remove('active');
                localStorage.setItem('theme', 'old');
            }
        }

        function setFontFamily(font) {
            document.body.style.fontFamily = font;
            localStorage.setItem('fontFamily', font);
        }
        
        function setPattern(pattern) {
            const gridLayer = document.querySelector('.grid-layer');
            if(!gridLayer) return;
            localStorage.setItem('bgPattern', pattern);
            gridLayer.style.backgroundImage = ''; gridLayer.style.backgroundSize = '';
            const color = 'var(--border-color)'; 
            if(pattern === 'grid') {
                gridLayer.style.backgroundImage = `linear-gradient(to right, ${color} 1px, transparent 1px), linear-gradient(to bottom, ${color} 1px, transparent 1px)`;
                gridLayer.style.backgroundSize = '60px 60px';
            } else if(pattern === 'dots') {
                gridLayer.style.backgroundImage = `radial-gradient(${color} 1px, transparent 1px)`;
                gridLayer.style.backgroundSize = '20px 20px';
            } else if(pattern === 'lines') {
                gridLayer.style.backgroundImage = `repeating-linear-gradient(45deg, ${color} 0, ${color} 1px, transparent 0, transparent 50%)`;
                gridLayer.style.backgroundSize = '30px 30px';
            } else if(pattern === 'none') {
                gridLayer.style.backgroundImage = 'none';
            }
        }
        
        function setLanguage(lang) {
            localStorage.setItem('language', lang);
            if (lang === 'ar') {
                document.documentElement.setAttribute('dir', 'rtl');
                document.documentElement.setAttribute('lang', 'ar');
                document.getElementById('btn-ar').classList.add('active');
                document.getElementById('btn-en').classList.remove('active');
            } else {
                document.documentElement.setAttribute('dir', 'ltr');
                document.documentElement.setAttribute('lang', 'en');
                document.getElementById('btn-en').classList.add('active');
                document.getElementById('btn-ar').classList.remove('active');
            }
            updateTranslations();
        }

        // تحميل الإعدادات
        const savedTheme = localStorage.getItem('theme') || 'old';
        setTheme(savedTheme);
        const savedFont = localStorage.getItem('fontFamily');
        if(savedFont) { document.body.style.fontFamily = savedFont; document.getElementById('font-family-select').value = savedFont; }
        const savedPattern = localStorage.getItem('bgPattern') || 'grid'; setPattern(savedPattern);
        const savedLang = localStorage.getItem('language') || 'ar'; setLanguage(savedLang);

        // --- إخفاء شاشة التحميل ---
        window.addEventListener('load', () => {
            document.body.classList.add('loaded');
        });
    </script>

    <div id="checkout-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center;">
        <div
            style="background:var(--card-bg); padding:30px; border-radius:20px; border:1px solid var(--border-color); width:90%; max-width:400px; position:relative;">
            <i class="fas fa-times" onclick="closeCheckout()" style="position:absolute; top:20px; left:20px; cursor:pointer; color:#666;"></i>
            <h2 style="color:var(--primary); text-align:center; margin-bottom:20px;" data-i18n="modal_title">بيانات الاستلام 🚚</h2>

            <div style="display:flex; flex-direction:column; gap:15px;">
                <input type="text" id="cust-name" placeholder="الاسم الثلاثي"
                    style="padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--input-bg); color:var(--text-main); outline:none;" data-i18n-ph="ph_name">
                <input type="number" id="cust-age" placeholder="العمر"
                    style="padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--input-bg); color:var(--text-main); outline:none;" data-i18n-ph="ph_age">
                <input type="text" id="cust-address" placeholder="العنوان بالتفصيل"
                    style="padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--input-bg); color:var(--text-main); outline:none;" data-i18n-ph="ph_address">
                <input type="tel" id="cust-phone" placeholder="رقم الواتساب (11 رقم)"
                    style="padding:12px; border-radius:10px; border:1px solid var(--border-color); background:var(--input-bg); color:var(--text-main); outline:none;" data-i18n-ph="ph_phone">

                <button onclick="confirmFinalOrder()" class="btn" style="width:100%; margin:0; padding:15px;" data-i18n="btn_confirm">إرسال الطلب عبر واتساب</button>
            </div>
